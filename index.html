<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7fbff">
 <meta name="description" content="SkinScope — a friendly place to understand your skin, keep a private photo journal and build your routine."><title>SkinScope</title>
 <link rel="icon" href="./app/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./app/journey.css">
</head>
<body>
 <a class="skip-link" href="#main">Skip to content</a>
 <aside class="desktop-nav" aria-label="Main navigation"><a class="sidebar-brand" href="#/home"><span class="brand-bubble">s</span>SkinScope</a><nav id="desktopLinks"></nav><div class="sidebar-bottom"><span class="private-badge"></span> Your journey. Your privacy.<button class="small-link" id="replayIntro">Replay welcome</button></div></aside>
 <div class="app-shell"><header class="app-header"><a href="#/home" class="mobile-brand">SkinScope</a><div class="header-context">Your daily skin journey</div><div class="header-metrics" id="headerMetrics" aria-label="Your streak, rank and photos"></div></header><div class="content-layout"><main id="main" tabindex="-1"></main><aside id="contextPanel" class="context-panel"></aside></div></div>
 <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>
 <input id="photoFile" type="file" accept="image/*" hidden><input id="cameraFile" type="file" accept="image/*" capture="user" hidden><input id="avatarFile" type="file" accept="image/*" hidden>
 <dialog id="messageDialog"><button class="dialog-close" aria-label="Close" data-action="close-dialog"></button><div id="dialogBody"></div></dialog>
 <div id="toast" role="status" aria-live="polite"></div>
 <section id="welcome" class="welcome" aria-label="Welcome to SkinScope" hidden>
  <div class="welcome-brand">SkinScope</div><div class="water-scene"><div class="water-light"></div><div class="water-ring ring-one"></div><div class="water-ring ring-two"></div><div class="water-ring ring-three"></div>
   <button id="bottleButton" class="bottle-button" aria-label="Tap the bottle to enter SkinScope">
    <img class="intro-bottle" src="./app/welcome-bottle.png" alt="" width="1024" height="1024" fetchpriority="high">
    <span class="milk-splash"></span><span class="milk-drop drop-one"></span><span class="milk-drop drop-two"></span><span class="milk-drop drop-three"></span>
   </button><div class="water-front"></div></div>
  <div class="welcome-copy"><h1>A fresh start.</h1><p>Tap the bottle to begin.</p></div><button id="skipWelcome" class="skip-welcome">Skip intro</button><div class="white-wash"></div>
 </section>
 <script src="./js/skinscope-api-config.js"></script><script src="./js/skinscope-api.js"></script><script type="module" src="./app/journey.js"></script>
</body></html>
